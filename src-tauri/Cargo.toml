[package]
name = "restmin"
version = "0.1.0"
description = "Offline restaurant billing and management"
edition = "2021"
rust-version = "1.82"

[lib]
name = "restmin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "restmin"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-single-instance"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
